<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07140f">
<title>Christmas Special</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(24,54,40,.34) 0%, rgba(7,20,15,0) 57%),
      #07140f;
    color: #f7f7f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .panel {
    width: min(100%, 760px);
    background: rgba(17, 39, 29, .78);
    border: 2px solid rgba(129, 155, 137, .38);
    border-radius: 42px;
    padding: 60px 44px 48px;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,.18);
  }
  .app-icon {
    width: 128px; height: 128px;
    margin: 0 auto 38px;
    border-radius: 34px;
    background: linear-gradient(145deg, #2558f2 5%, #6746df 48%, #ed6485 77%, #e8d76e 100%);
    display: grid; place-items: center;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.22);
  }
  .app-icon img { width: 100%; height: 100%; display:block; object-fit:cover; border-radius:34px; }
  .eyebrow {
    color: #f0d99b;
    font-size: 27px;
    font-weight: 750;
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(34px, 6.5vw, 58px);
    line-height: 1.08;
    letter-spacing: -1.8px;
    margin: 0 0 42px;
    font-weight: 800;
    white-space: nowrap;
  }
  .safari {
    display: flex; align-items: center; justify-content: center;
    min-height: 108px;
    width: 100%;
    border: 0;
    border-radius: 29px;
    background: linear-gradient(105deg, #b51c46, #a9143d);
    color: white;
    font: inherit;
    font-size: 34px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 12px 30px rgba(154, 15, 54, .24);
    cursor: pointer;
  }
  .copy {
    display: inline-block;
    margin: 34px 0 48px;
    color: #f1d99c;
    font-size: 25px;
    text-decoration: underline;
    text-underline-offset: 3px;
    background: none; border: 0; cursor: pointer;
    font-family: inherit;
  }
  .rule { height: 2px; background: rgba(164,184,169,.3); margin-bottom: 32px; }
  details { text-align: left; color: #f0d99b; font-size: 25px; }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display:none; }
  summary:before { content: "▸ "; font-size: 18px; vertical-align: 3px; }
  details[open] summary:before { content: "▾ "; }
  .help {
    padding: 20px 0 0 22px;
    color: #e8d7ac;
    font-size: 18px;
    line-height: 1.55;
  }
  .toast {
    position: fixed; bottom: calc(22px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); background: #263b30; color: #fff;
    padding: 12px 18px; border-radius: 999px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 520px) {
    body { padding: 18px 18px calc(24px + env(safe-area-inset-bottom)); }
    .panel { padding: 60px 44px 48px; border-radius: 42px; }
    .app-icon { width: 128px; height: 128px; margin-bottom: 38px; }
    .eyebrow { font-size: 27px; margin-bottom: 24px; }
    h1 { font-size: clamp(34px, 7.7vw, 44px); letter-spacing: -1.5px; margin-bottom: 42px; }
    .safari { min-height: 108px; font-size: 34px; border-radius: 29px; }
    .copy { font-size: 25px; margin: 34px 0 48px; }
    details { font-size: 25px; }
  }
  @media (max-width: 390px) {
    .panel { padding-left: 26px; padding-right: 26px; }
    h1 { white-space: normal; }
    .eyebrow { font-size: 23px; }
    .safari { font-size: 29px; }
    details { font-size: 21px; }
  }
</style>
</head>

    <div class="eyebrow">🎄 Christmas Special</div>
    <h1>Continue in your browser</h1>
    <a class="safari" href="/" id="continueButton">Open in Safari</a>
    <button class="copy" id="copyButton" type="button">Copy link</button>
    <div class="rule"></div>
    <details>
      <summary>Need help opening your browser?</summary>
      <div class="help">
        Tap the three dots in the top corner of TikTok, then choose <strong>Open in browser</strong> or <strong>Open in Safari</strong> if that option appears. You can also use “Copy link” and paste the link into Safari.
      </div>
    </details>
  </main>
  <div class="toast" id="toast">Link copied</div>
<script>
  // Send visitors to the existing lander and preserve incoming tracking parameters.
  const destinationUrl = new URL("/", window.location.href);
  const incomingParams = new URLSearchParams(window.location.search);
  incomingParams.forEach((value, key) => destinationUrl.searchParams.set(key, value));
  const destination = destinationUrl.href;
  document.getElementById("continueButton").href = destination;
  document.getElementById("copyButton").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(destination);
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    } catch (e) {
      window.prompt("Copy this link:", destination);
    }
  });
</script>
